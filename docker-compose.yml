services:

  # ── Redis: ingestion queue ────────────────────────────────────────────────
  redis-ingestion:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-ingestion-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis: agent queue (Redis Stack — RediSearch required by AsyncRedisSaver)
  redis-agent:
    image: redis/redis-stack-server:latest
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis-agent-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Chroma vector store ───────────────────────────────────────────────────
  chroma:
    image: chromadb/chroma:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Ingestion worker ──────────────────────────────────────────────────────
  worker-ingestion:
    build: .
    restart: unless-stopped
    command: >
      celery -A app.workers.ingestion_worker.celery_app worker
      -Q ingestion --pool=prefork -c 4 -l info
      --without-gossip --without-mingle
    env_file: .env
    environment:
      REDIS_INGESTION_URL: redis://redis-ingestion:6379/0
      REDIS_AGENT_URL: redis://redis-agent:6379/0
      CHROMA_URL: http://chroma:8000
    volumes:
      - ./app/data:/app/app/data
    depends_on:
      redis-ingestion:
        condition: service_healthy
      chroma:
        condition: service_healthy

  # ── Agent worker ──────────────────────────────────────────────────────────
  worker-agent:
    build: .
    restart: unless-stopped
    command: >
      celery -A app.workers.agent_worker.celery_app worker
      -Q agent --pool=prefork -c 2 -l info
      --without-gossip --without-mingle
    env_file: .env
    environment:
      REDIS_INGESTION_URL: redis://redis-ingestion:6379/0
      REDIS_AGENT_URL: redis://redis-agent:6379/0
      CHROMA_URL: http://chroma:8000
    volumes:
      - ./app/data:/app/app/data
    depends_on:
      redis-agent:
        condition: service_healthy
      chroma:
        condition: service_healthy

  # ── Flower: monitor ingestion queue (port 5555) ───────────────────────────
  flower-ingestion:
    image: mher/flower:2.0
    restart: unless-stopped
    ports:
      - "5555:5555"
    command: >
      celery flower
      --broker=redis://redis-ingestion:6379/0
      --port=5555
    environment:
      CELERY_APP: app.workers.ingestion_worker.celery_app
    depends_on:
      redis-ingestion:
        condition: service_healthy

  # ── Flower: monitor agent queue (port 5556) ───────────────────────────────
  flower-agent:
    image: mher/flower:2.0
    restart: unless-stopped
    ports:
      - "5556:5555"
    command: >
      celery flower
      --broker=redis://redis-agent:6379/0
      --port=5555
    environment:
      CELERY_APP: app.workers.agent_worker.celery_app
    depends_on:
      redis-agent:
        condition: service_healthy

  # ── MongoDB: chat history ─────────────────────────────────────────────────
  mongodb:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── FastAPI application ───────────────────────────────────────────────────
  api:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080
    env_file: .env
    environment:
      REDIS_INGESTION_URL: redis://redis-ingestion:6379/0
      REDIS_AGENT_URL: redis://redis-agent:6379/0
      CHROMA_URL: http://chroma:8000
      MONGODB_CHAT_URL: mongodb://mongodb:27017
    volumes:
      - ./app/data:/app/app/data
    depends_on:
      redis-ingestion:
        condition: service_healthy
      redis-agent:
        condition: service_healthy
      chroma:
        condition: service_healthy
      mongodb:
        condition: service_healthy

volumes:
  chroma-data:
  redis-ingestion-data:
  redis-agent-data:
  mongodb-data:
