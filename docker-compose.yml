# =============================================================================
# SciBot: one command to run everything
#
#   docker compose up            # pulls suryaanshrai/scibot, builds locally if the pull fails
#   docker compose up --build    # always build the image from this checkout
#   docker compose pull          # update to the latest published image
#
# Then open http://localhost:8080
#
# No .env file is required. Provider API keys can be set per user in
# Settings → LLM / API Keys, or globally in a .env file next to this one
# (see .env.example). This file also works on its own, outside the repo:
# put it in an empty folder and run `docker compose up`.
#
# For a VPS with HTTPS, layer the production override on top:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =============================================================================

name: scibot

x-scibot-env: &scibot-env
  REDIS_URL: redis://redis:6379/0
  POSTGRES_CONNECTION_STRING: postgresql+psycopg://scibot:${POSTGRES_PASSWORD:-scibot}@postgres:5432/scibot
  POSTGRES_ASYNC_URL: postgresql://scibot:${POSTGRES_PASSWORD:-scibot}@postgres:5432/scibot
  DEFAULT_STORE_PROVIDER: ${DEFAULT_STORE_PROVIDER:-postgres}
  PYTHONUNBUFFERED: "1"

x-scibot-app: &scibot-app
  # The API and both workers run the same image. Only `api` declares `build`;
  # Compose builds it once and the workers reuse the result.
  image: ${SCIBOT_IMAGE:-suryaanshrai/scibot:latest}
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment: *scibot-env
  extra_hosts:
    - "host.docker.internal:host-gateway"   # reach Ollama etc. running on the host
  volumes:
    - scibot-data:/app/app/data      # SQLite users DB, uploads, collection metadata
    - scibot-cache:/root/.cache      # downloaded OCR / speech / embedding models
  depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:

  # ── PostgreSQL: vectors (pgvector), chat history, LangGraph checkpoints,
  #               and real-time SSE pub/sub (LISTEN/NOTIFY)
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: scibot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scibot}
      POSTGRES_DB: scibot
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scibot -d scibot"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── Redis: Celery broker + task result backend
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --protected-mode no
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── Ingestion worker: OCR, transcription, chunking and embedding
  worker-ingestion:
    <<: *scibot-app
    command: >
      celery -A app.workers.ingestion_worker.celery_app worker
      -Q ingestion --pool=prefork -c 2 -l info
      --without-gossip --without-mingle

  # ── Agent worker: Orchestrator → Researcher → Checker runs
  worker-agent:
    <<: *scibot-app
    command: >
      celery -A app.workers.agent_worker.celery_app worker
      -Q agent --pool=prefork -c 2 -l info
      --without-gossip --without-mingle

  # ── API + frontend on http://localhost:8080
  api:
    <<: *scibot-app
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080
    ports:
      - "${SCIBOT_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres-data:
  redis-data:
  scibot-data:
  scibot-cache:
