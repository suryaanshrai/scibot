# Development overrides for docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose-dev.yml up
#
# Changes from production:
#  - Source code is bind-mounted so code changes take effect without rebuilding
#  - Workers reload automatically on code changes (watchfiles)
#  - Chroma port also exposed for direct local access during development
#  - Flower instances restart always for convenience

services:

  worker-ingestion:
    build:
      context: .
      target: builder          # Use the builder stage so .venv is already populated
    command: >
      celery -A app.workers.ingestion_worker.celery_app worker
      -Q ingestion --pool=prefork -c 2 -l debug
      --without-gossip --without-mingle
      --autoscale=4,1
    volumes:
      - .:/app                  # live-reload: every file change is visible immediately
      - ./app/data:/app/app/data
    environment:
      PYTHONPATH: /app
      REDIS_INGESTION_URL: redis://redis-ingestion:6379/0
      REDIS_AGENT_URL: redis://redis-agent:6379/0
      CHROMA_URL: http://chroma:8000
    restart: always

  worker-agent:
    build:
      context: .
      target: builder
    command: >
      celery -A app.workers.agent_worker.celery_app worker
      -Q agent --pool=prefork -c 1 -l debug
      --without-gossip --without-mingle
    volumes:
      - .:/app
      - ./app/data:/app/app/data
    environment:
      PYTHONPATH: /app
      REDIS_INGESTION_URL: redis://redis-ingestion:6379/0
      REDIS_AGENT_URL: redis://redis-agent:6379/0
      CHROMA_URL: http://chroma:8000
    restart: always

  flower-ingestion:
    restart: always

  flower-agent:
    restart: always

  redis-ingestion:
    restart: always

  redis-agent:
    restart: always

  chroma:
    restart: always
    ports:
      - "8000:8000"             # already in base; explicit here for clarity

  mongodb:
    restart: always

  api:
    build:
      context: .
      target: builder
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload
    volumes:
      - .:/app
      - ./app/data:/app/app/data
    environment:
      PYTHONPATH: /app
      REDIS_INGESTION_URL: redis://redis-ingestion:6379/0
      REDIS_AGENT_URL: redis://redis-agent:6379/0
      CHROMA_URL: http://chroma:8000
      MONGODB_CHAT_URL: mongodb://mongodb:27017
    restart: always
