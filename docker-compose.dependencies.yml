# =============================================================================
# SciBot dependencies only: Postgres (pgvector) + Redis, with ports published
#
#   docker compose -f docker-compose.dependencies.yml up -d
#
# Use this to run the API, workers and frontend on the host (see README):
#   POSTGRES_CONNECTION_STRING=postgresql+psycopg://scibot:scibot@127.0.0.1:5432/scibot
#   POSTGRES_ASYNC_URL=postgresql://scibot:scibot@127.0.0.1:5432/scibot
#   REDIS_URL=redis://127.0.0.1:6379/0
# =============================================================================

name: scibot-deps

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: scibot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scibot}
      POSTGRES_DB: scibot
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scibot -d scibot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --protected-mode no
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  redis-data:
